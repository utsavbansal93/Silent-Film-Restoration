profile_name: modern_smooth

source:
  # Source stays pristine. S00 applies the start-time offset at frame-extraction
  # time via ffmpeg -ss (no re-encode). See s00_ingest.source_start_time_s.
  path: source/lanka_dahan_1917.webm
  sha256: null  # filled by S00 on first run

run:
  output_root: runs/
  stages_to_run: [s00, s01, s02]

s00_ingest:
  output_format: png
  preserve_audio: false
  parallel_workers: 4
  # Skip the 3.000s of pure-black leader + dim fade-in.
  # Frame 75 of the original is the first frame of real content (see JOURNAL).
  source_start_time_s: 3.0

s01_probe:
  shot_detection:
    # content_plus_adaptive = union of ContentDetector + AdaptiveDetector.
    # Silent-era hand-cut splices often slip past ContentDetector alone; the
    # AdaptiveDetector catches gradual/soft cuts. Threshold lowered from 27→15
    # per cuts seen in the full-source S02 pass 1 review (JOURNAL D13).
    method: content_plus_adaptive
    threshold: 15.0
    adaptive_threshold: 3.0
    min_scene_len: 10
  damage_heuristics:
    laplacian_blur_threshold: 100.0
    dark_frame_threshold: 0.02
  intertitle_detection:
    enabled: true
    method: east
    model_path: models/frozen_east_text_detection.pb
    min_confidence: 0.5
    area_threshold: 0.08
    resize_width: 640
    resize_height: 384

s02_stabilise:
  # skimage_phase_corr = FFT sub-pixel registration for film-weave removal.
  # Set to `passthrough` to bypass stabilisation entirely.
  method: skimage_phase_corr
  smoothing: 25         # wide window: weave = high-freq, pans = low-freq
  upsample_factor: 10   # 0.1 px precision
  per_shot: true
  crop: keep
  skip_intertitles: true
