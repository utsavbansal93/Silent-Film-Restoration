[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silent-film-restoration"
version = "0.1.0"
description = "Modular pipeline for restoring surviving silent-era film fragments. First project: Lanka Dahan (1917)."
requires-python = ">=3.11"
license = { text = "CC-BY-SA-4.0" }
authors = [{ name = "Utsav Bansal", email = "utsavbansal93@gmail.com" }]

dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "click>=8.1",
    "numpy>=1.26",
    "pillow>=10.0",
    "ffmpeg-python>=0.2",
    "opencv-python-headless>=4.8",
    "scenedetect[opencv-headless]>=0.6.3",
    "scikit-image>=0.22",
    "psutil>=5.9",
    "easyocr>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "ocr*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ocr/tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end stage tests on the 30s fixture",
    "golden: golden-frame hash regression tests",
    "slow: tests that process >10s of video",
]
